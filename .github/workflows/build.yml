name: Build mod jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and test the core mod
        working-directory: mod
        run: ./gradlew build --console=plain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the jar
        run: python tools/build_jar.py

      - uses: actions/upload-artifact@v4
        with:
          name: learn-or-die-chinese-custom
          path: build/learn-or-die-chinese-custom+mc26.3.jar
          if-no-files-found: error
